version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skillledger-sqlserver
    environment:
      - ACCEPT_EULA=Y
      # CFG-HIGH-001 FIX: Use environment variable instead of hardcoded password
      # Set MSSQL_SA_PASSWORD environment variable before running docker-compose
      # Example: export MSSQL_SA_PASSWORD='YourSecurePassword123!' && docker-compose up
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-ChangeThisDefaultPassword123!}
      - MSSQL_PID=Developer
    ports:
      - "9030:1433"  # SkillLedger uses port 9030 (standardized port allocation)
    volumes:
      - skillledger-sqldata:/var/opt/mssql
    healthcheck:
      # Note: For healthcheck, use the same env var or a separate healthcheck user
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD:-ChangeThisDefaultPassword123!}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - skillledger-network

volumes:
  skillledger-sqldata:
    name: skillledger-sqldata

networks:
  skillledger-network:
    name: skillledger-network
    driver: bridge